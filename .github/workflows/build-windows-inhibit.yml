# Builds a Windows installer for the inhibit line on main.
#
# The installer label is release-state.txt plus the suffix in
# CMake/Modules/inhibit-identity.cmake. With the current state that is
# 3.3.0-beta6-inhibit. Bumping the beta in release-state.txt renames the
# installer on the next run; the suffix file is the only marker to edit.
#
# inhibit-on-3.2-rc1 is not built: that branch is the older 3.2.0-rc1 port,
# and this version label would misname its installer.
#
# release_channel is omitted. build-windows.yml workflow_call does not accept
# it (passing it fails the call), and an empty channel follows
# release-state.txt. The version input is the installer and artifact label.
# CMake appends the same inhibit suffix to the version the program reports.
#
# pull_request is listed for pulls into main. GitHub decides that event from
# the workflow on the default branch. main already carries pull_request, so a
# pull request into main can start a run. The rebase branch is also listed
# under push so the verification push starts the installer build on this
# branch. Drop that branch entry only after this line is on main; the commit
# that drops it does not re-run.
name: Windows installer for inhibit main

on:
  push:
    branches:
      - main
      - rebase-v3.3.0-beta6
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      label: ${{ steps.v.outputs.label }}
    steps:
      - uses: actions/checkout@v7
      - name: Check inhibit version identity
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y cmake
          fi
          python3 .github/scripts/tests/test_inhibit_release_identity.py
          cmake -D SOURCE_DIR="$PWD" -D TEST_BINARY_DIR="${RUNNER_TEMP}/inhibit-identity" \
            -P tests/release/test_inhibit_identity.cmake
      - id: v
        run: python3 .github/scripts/inhibit-release-identity.py --github-output >> "$GITHUB_OUTPUT"

  windows:
    needs: identity
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.identity.outputs.label }}
      hamlib_branch: "4.7.2"
      save_ccache: false
      recache: false
